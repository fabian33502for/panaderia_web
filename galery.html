<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fotos de nuestro pan, pasteles y del día a día en el horno.">
  <title>Galery | Panadería Dulce Hogar</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <header class="header">
    <div class="contenedor header__fila">
      <a href="index.html" class="logo">🥖 Dulce Hogar</a>
      <button class="menu-boton" aria-label="Abrir menú" aria-expanded="false">☰</button>
      <nav class="nav">
        <a href="index.html#inicio">Inicio</a>
        <a href="index.html#productos">Productos</a>
        <a href="index.html#nosotros">Nosotros</a>
        <a href="index.html#contacto">Contacto</a>
        <a href="galery.html" aria-current="page">Galery</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="contenedor">
        <h1>Galery</h1>
        <p>Fotos de nuestro pan, pasteles y del día a día en el horno.</p>
      </div>
    </section>

    <section class="seccion">
      <div class="contenedor">
        <h2>Recién horneado</h2>
        <div class="galeria">
          <figure>
            <img src="img/foto-1.jpg" alt="Hogazas de pan de masa madre con la corteza dorada y crujiente">
            <figcaption>Pan de masa madre</figcaption>
          </figure>
          <figure>
            <img src="img/foto-2.jpg" alt="Charola de cuernitos de mantequilla recién salidos del horno">
            <figcaption>Cuernitos de mantequilla</figcaption>
          </figure>
          <figure>
            <img src="img/foto-3.jpg" alt="Pastel de cumpleaños decorado con crema y fresas">
            <figcaption>Pasteles por encargo</figcaption>
          </figure>
          <figure>
            <img src="img/foto-4.jpg" alt="Manos amasando la masa sobre una mesa enharinada">
            <figcaption>Amasado a mano</figcaption>
          </figure>
          <figure>
            <img src="img/foto-5.jpg" alt="Pan entrando al horno de la panadería por la mañana">
            <figcaption>Al horno desde las 5 de la mañana</figcaption>
          </figure>
          <figure>
            <img src="img/foto-6.jpg" alt="Mostrador de la panadería con canastas llenas de pan dulce">
            <figcaption>Nuestro mostrador</figcaption>
          </figure>
        </div>
      </div>
    </section>

    <section class="seccion seccion--alterna">
      <div class="contenedor centrado">
        <h2>¿Se te antojó?</h2>
        <p>Visítanos o encarga tu pastel con anticipación.</p>
        <a href="index.html#contacto" class="boton">Ver horario y contacto</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="contenedor">
      <p>&copy; 2026 Panadería Dulce Hogar</p>
    </div>
  </footer>
</body>
</html>
